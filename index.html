    <script>
      // Prevent "Cannot set property fetch of #<Window> which has only a getter" in sandbox iframes/polyfills
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var activeFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore defineProperty error
        }
      })();
    </script>
